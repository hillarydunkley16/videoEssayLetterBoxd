<title>Visual Arguments Lists — Empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1D21;
    --paper: #F1F1EE;
    --paper-dim: #E2E2DD;
    --cobalt: #2F5DFF;
    --teal: #1E7A6C;
    --slate: #63666C;

    --bg: var(--paper);
    --surface: var(--paper-dim);
    --text: var(--ink);
    --muted: var(--slate);
    --border: rgba(27, 29, 33, 0.14);
    --accent: var(--cobalt);
    --accent-ink: #fff;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: var(--ink);
      --surface: #24262B;
      --text: var(--paper);
      --muted: #93969E;
      --border: rgba(241,241,238,0.14);
      --accent: #5B7CFF;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--ink);
    --surface: #24262B;
    --text: var(--paper);
    --muted: #93969E;
    --border: rgba(241,241,238,0.14);
    --accent: #5B7CFF;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .frame {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    padding: 0 0 48px;
    display: flex;
    flex-direction: column;
  }

  /* ---- top bar ---- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 10px;
  }
  .topbar .brand {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .topbar .brand em { color: var(--accent); font-style: normal; }
  .icon-btn {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border-radius: 50%;
    color: var(--muted);
    background: transparent;
  }

  /* ---- page header ---- */
  .header {
    padding: 4px 20px 18px;
    border-bottom: 1px solid var(--border);
  }
  .page-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 26px;
    line-height: 1.1;
    margin: 0 0 6px;
  }
  .page-sub {
    font-size: 13.5px;
    color: var(--muted);
    max-width: 34ch;
    line-height: 1.5;
    margin: 0;
  }

  /* ---- empty state ---- */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 32px 64px;
    gap: 14px;
  }
  .empty-mark {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    display: grid;
    place-items: center;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .empty-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: 21px;
    color: var(--muted);
    margin: 0;
  }
  .empty-sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    max-width: 30ch;
    margin: 0;
  }
  .empty-cta {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 3px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 13px;
    font-weight: 600;
  }
</style>

<div class="frame">
  <div class="topbar">
    <div class="brand">visual <em>arguments</em></div>
    <div class="icon-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" stroke="currentColor" stroke-width="1.6"/><path d="M4 12a8 8 0 0016 0 8 8 0 00-16 0z" stroke="currentColor" stroke-width="1.6" opacity=".35"/></svg>
    </div>
  </div>

  <div class="header">
    <h1 class="page-title">Your Lists</h1>
    <p class="page-sub">Essays you've grouped together — a rabbit hole, a double feature, a shelf for later.</p>
  </div>

  <div class="empty">
    <div class="empty-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="4" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="12" width="16" height="4" rx="1" stroke="currentColor" stroke-width="1.6" opacity=".55"/><rect x="4" y="19" width="10" height="0" stroke="currentColor" stroke-width="1.6"/></svg>
    </div>
    <p class="empty-title">No lists yet&hellip;</p>
    <p class="empty-sub">Group essays into a list from any video's page — start with something you've already logged.</p>
    <div class="empty-cta">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      New list
    </div>
  </div>
</div>
