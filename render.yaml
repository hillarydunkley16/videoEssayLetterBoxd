# Render Blueprint — closed-beta deployment (all resources on the free plan).
# See DEPLOY.md for the dashboard steps and where each `sync: false` value comes from.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: videoessay-db
    plan: free
    databaseName: videoessay
    user: videoessay

services:
  # --- Django API (DRF + admin) ------------------------------------------
  - name: videoessay-backend
    type: web
    runtime: python
    plan: free
    rootDir: backend
    # Build = install only. migrate + collectstatic run in startCommand so they
    # execute with the full runtime env (CLERK_ISSUER etc.) present — settings.py
    # raises on a missing CLERK_ISSUER, and sync:false vars aren't guaranteed at
    # build time. Free tier is a single instance, so no migration race.
    # preDeployCommand is paid-only, so it's not an option here.
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION      # Render ignored runtime.txt and used 3.14; pin explicitly
        value: "3.13.7"
      - key: DATABASE_URL
        fromDatabase:
          name: videoessay-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # ALLOWED_HOSTS / CSRF get the service's own *.onrender.com host
      # automatically (RENDER_EXTERNAL_HOSTNAME, handled in settings.py).
      # Set these two once the frontend URL is known (Task 13):
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS   # the static site's https origin
        sync: false
      # Clerk production instance (Task 10):
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_ISSUER_LEGACY    # optional: old dev issuer during cutover
        sync: false
      - key: SERPAPI_KEY
        sync: false

  # --- Expo web app (static bundle) ------------------------------------
  - name: videoessay-web
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: EXPO_PUBLIC_API_BASE_URL          # https://videoessay-backend.onrender.com
        sync: false
      - key: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY # Clerk prod publishable key (Task 10)
        sync: false
