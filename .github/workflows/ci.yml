name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # settings.py uses a manifest static storage, so rendering the admin
      # needs collectstatic to have run (staticfiles/ is gitignored).
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Tests
        run: python manage.py test
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Deploy check
        run: python manage.py check --deploy
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-0123456789-0123456789
          DJANGO_ALLOWED_HOSTS: example.com
          CORS_ALLOWED_ORIGINS: https://example.com
          CLERK_ISSUER: https://clerk.example.com

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci
      - name: Web export
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.com
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
